name: chantier_track
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  fl_chart: ^1.2.0
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.0
  connectivity_plus: ^7.3.1
  local_auth: ^2.2.0
  pdf: ^3.11.1
  printing: ^5.13.0
  share_plus: 13.3.0
  font_awesome_flutter: ^11.0.0
  google_generative_ai: ^0.4.3
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

